<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050505" />
    <title>Страница не найдена - Голос Души</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Arial, sans-serif;
        background: #050505;
        color: #eeeeea;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at center, rgba(255, 255, 255, 0.08), transparent 32%),
          #050505;
      }

      main {
        max-width: 560px;
        padding: 42px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        text-align: center;
        background: rgba(8, 8, 8, 0.74);
      }

      h1 {
        margin: 0 0 14px;
        font-family: Georgia, serif;
        font-size: clamp(42px, 10vw, 72px);
      }

      p {
        margin: 0 0 28px;
        color: #aaa7a2;
        line-height: 1.6;
      }

      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        border-radius: 16px;
        color: #fffdfb;
        font-weight: 700;
        text-decoration: none;
        background: linear-gradient(135deg, #a38f84, #c0afa6);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Эта страница растворилась в темноте. Вернитесь на главную страницу Голоса Души.</p>
      <a href="./">На главную</a>
    </main>
  </body>
</html>
